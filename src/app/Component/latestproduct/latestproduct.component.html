<div class="product-section py-2">
  <div class="container">
    <div class="row g-4" id="product-list">
      @for (product of products; track product.id) {
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <app-product-card [product]="product"></app-product-card>
        </div>
      }
    </div>
  </div>

  @if (isEmpty) {
    <div class="container d-flex flex-column justify-content-center align-items-center py-5" style="min-height: 40vh;">
      <i class="bi bi-box-seam display-1 text-muted mb-3 opacity-50"></i>
      <h3 class="text-muted fw-semibold">No products available at the moment.</h3>
      <p class="text-secondary small">Please check back soon for our fresh arrivals.</p>
    </div>
  }
</div>
