<div class="update-profile-page-wrapper py-4 py-md-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8 col-xl-7">
        
        <!-- Update Profile Card (No Breadcrumbs) -->
        <div class="profile-card bg-white rounded-4 p-4 p-md-5 shadow-sm border-0 position-relative overflow-hidden">
          
          <!-- Decorative Top Accent Bar -->
          <div class="card-accent-bar"></div>

          <!-- Header -->
          <div class="mb-4 pb-3 border-bottom">
            <h1 class="page-title font-serif text-dark fw-bold mb-1">Edit Profile</h1>
            <p class="page-subtitle text-muted mb-0">
              Update your contact details and default shipping address below.
            </p>
          </div>

          @if (!isLoading) {
            <form (ngSubmit)="onSubmit()" novalidate>
              <div class="row g-3">
                
                <!-- Full Name -->
                <div class="col-12 col-md-6">
                  <label for="name" class="form-label-custom">Full Name <span class="text-danger">*</span></label>
                  <input 
                    type="text" 
                    class="form-control-custom" 
                    id="name" 
                    name="name"
                    [(ngModel)]="user.name" 
                    placeholder="e.g. John Doe"
                    required>
                </div>

                <!-- Email (Read Only) -->
                <div class="col-12 col-md-6">
                  <label for="email" class="form-label-custom">Email Address</label>
                  <div class="input-icon-wrap position-relative">
                    <input 
                      type="email" 
                      class="form-control-custom bg-light cursor-not-allowed" 
                      id="email" 
                      name="email"
                      [(ngModel)]="user.email" 
                      disabled>
                    <i class="bi bi-lock-fill input-icon text-muted"></i>
                  </div>
                </div>

                <!-- Contact Number -->
                <div class="col-12 col-md-6">
                  <label for="contactNumber" class="form-label-custom">Contact Phone <span class="text-danger">*</span></label>
                  <div class="input-icon-wrap position-relative">
                    <input 
                      type="tel" 
                      class="form-control-custom" 
                      id="contactNumber" 
                      name="contactNumber"
                      [(ngModel)]="user.contactNumber" 
                      placeholder="10-digit mobile number"
                      required>
                    <i class="bi bi-telephone input-icon text-muted"></i>
                  </div>
                </div>

                <!-- Pincode -->
                <div class="col-12 col-md-6">
                  <label for="pincode" class="form-label-custom">PIN / Postal Code <span class="text-danger">*</span></label>
                  <input 
                    type="text" 
                    class="form-control-custom" 
                    id="pincode" 
                    name="pincode"
                    [(ngModel)]="newAddress.pincode" 
                    placeholder="e.g. 400001"
                    required>
                </div>

                <!-- City -->
                <div class="col-12 col-md-6">
                  <label for="city" class="form-label-custom">City <span class="text-danger">*</span></label>
                  <input 
                    type="text" 
                    class="form-control-custom" 
                    id="city" 
                    name="city"
                    [(ngModel)]="newAddress.city" 
                    placeholder="e.g. Mumbai"
                    required>
                </div>

                <!-- State -->
                <div class="col-12 col-md-6">
                  <label for="state" class="form-label-custom">State <span class="text-danger">*</span></label>
                  <input 
                    type="text" 
                    class="form-control-custom" 
                    id="state" 
                    name="state"
                    [(ngModel)]="newAddress.state" 
                    placeholder="e.g. Maharashtra"
                    required>
                </div>

                <!-- Street Address -->
                <div class="col-12">
                  <label for="address" class="form-label-custom">Street Address & Landmark <span class="text-danger">*</span></label>
                  <textarea 
                    class="form-control-custom" 
                    id="address" 
                    name="address"
                    rows="3"
                    [(ngModel)]="newAddress.address" 
                    placeholder="House/Flat no., Building name, Street area, Landmark"
                    required></textarea>
                </div>

              </div>

              <!-- Action Buttons -->
              <div class="d-flex flex-column flex-sm-row gap-3 justify-content-start align-items-center mt-4 pt-3 border-top">
                <button 
                  type="submit" 
                  class="btn btn-save-profile px-4 py-2-5 rounded-3 fw-bold d-inline-flex align-items-center justify-content-center gap-2 w-100 w-sm-auto"
                  [disabled]="isSubmitting">
                  <i class="bi bi-check2-circle"></i>
                  <span>Save Changes</span>
                </button>

                <a 
                  routerLink="/userprofile" 
                  class="btn btn-cancel-edit px-4 py-2-5 rounded-3 fw-semibold d-inline-flex align-items-center justify-content-center gap-2 w-100 w-sm-auto">
                  <i class="bi bi-x-lg"></i>
                  <span>Cancel</span>
                </a>
              </div>
            </form>
          } @else {
            <div class="loading-state d-flex justify-content-center align-items-center py-5" style="min-height: 300px;">
              <div class="spinner-border text-warning" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading profile...</span>
              </div>
            </div>
          }

        </div>

      </div>
    </div>
  </div>
</div>
