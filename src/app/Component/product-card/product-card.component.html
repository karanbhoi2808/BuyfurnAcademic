<div class="card product-card h-100 border-0 rounded-4 overflow-hidden shadow-sm"
  (click)="productDetailPage(product().id)" role="button">
  <!-- Image Wrapper with Stock Badge -->
  <div class="card-img-wrapper position-relative overflow-hidden">
    <span class="badge stock-badge position-absolute">
      {{ product().stockStatus || 'In Stock' }}
    </span>
    <img
      [src]="product().productImages && product().productImages[0] ? product().productImages[0].url : 'assets/images/couch.png'"
      [alt]="product().title" class="card-img-top product-img">
  </div>

  <!-- Card Body Content -->
  <div class="card-body d-flex flex-column p-3 p-md-4">
    <h3 class="product-title font-serif text-dark fw-bold mb-2">
      {{ product().title }}
    </h3>

    <p class="product-subtitle text-secondary small mb-3">
      {{ getSubtitle() }}
    </p>

    <!-- Price & Action Button Footer -->
    <div class="mt-auto d-flex align-items-center justify-content-between pt-2">
      <span class="product-price fw-bold text-dark fs-5">
        ₹{{ product().price ? product().price.toFixed(2) : '0.00' }}
      </span>
      <button class="btn btn-mint-action rounded-3 d-inline-flex align-items-center justify-content-center"
        (click)="$event.stopPropagation(); productDetailPage(product().id)" title="View Details"
        aria-label="View Details">
        <i class="bi bi-bag"></i>
      </button>
    </div>
  </div>
</div>
